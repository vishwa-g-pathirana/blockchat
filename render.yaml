# Render Blueprint — deploys BlockChat (bootstrap node + static frontend) for free.
# In Render: New + → Blueprint → connect this repo → Apply.  Spec: render.com/docs/blueprint-spec
services:
  # ---- backend: the bootstrap node (Node + Socket.IO + SQLite) ----
  - type: web
    name: blockchat-node
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"

  # ---- frontend: the React app, served as static files ----
  - type: web
    name: blockchat-web
    runtime: static
    rootDir: .
    buildCommand: npm install --include=dev && npm run build -w client
    staticPublishPath: client/dist
    envVars:
      # Set this to the blockchat-node URL after the first deploy, then redeploy.
      - key: VITE_SERVER_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
